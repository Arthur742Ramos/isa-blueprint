[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isabelle-blueprint"
version = "0.1.0"
description = "Project planning, dependency tracking, and AI-task orchestration for Isabelle formalization projects."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "IsabelleBlueprint contributors" },
]
keywords = ["isabelle", "formal-verification", "blueprint", "dependency-graph", "theorem-proving"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[project.scripts]
isabelle-blueprint = "isabelle_blueprint.cli:main"

[project.urls]
Homepage = "https://github.com/Arthur742Ramos/isa-blueprint"
Repository = "https://github.com/Arthur742Ramos/isa-blueprint"
Issues = "https://github.com/Arthur742Ramos/isa-blueprint/issues"

[tool.setuptools.packages.find]
include = ["isabelle_blueprint*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
isabelle_blueprint = [
  "render/templates/*.j2",
  "render/templates/static/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
