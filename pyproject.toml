[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isabelle-blueprint"
version = "1.18.0"
description = "Project planning, dependency tracking, and AI-task orchestration for Isabelle formalization projects."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "IsabelleBlueprint contributors" },
]
keywords = ["isabelle", "formal-verification", "blueprint", "dependency-graph", "theorem-proving"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Documentation",
  "Typing :: Typed",
]
dependencies = [
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "mcp>=1.12.4,<3.0",
  "jsonschema>=4.18",
  "types-PyYAML",
  "build",
]
mcp = [
  "mcp>=1.12.4,<3.0",
  "typing-extensions>=4.7",
]

[project.scripts]
isabelle-blueprint = "isabelle_blueprint.cli:main"
isabelle-blueprint-mcp = "isabelle_blueprint.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Arthur742Ramos/isa-blueprint"
Repository = "https://github.com/Arthur742Ramos/isa-blueprint"
Issues = "https://github.com/Arthur742Ramos/isa-blueprint/issues"
Changelog = "https://github.com/Arthur742Ramos/isa-blueprint/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["isabelle_blueprint*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
isabelle_blueprint = [
  "render/templates/*.j2",
  "render/templates/static/*",
  "schemas/*.schema.json",
  "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples", "vscode"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["isabelle_blueprint"]
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
strict_equality = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 87
