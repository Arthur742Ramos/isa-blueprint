name: Blueprint syntax question
description: Ask about Markdown, LaTeX, or Isabelle fact linking syntax.
title: "[Syntax]: "
labels: ["documentation", "question"]
body:
  - type: dropdown
    id: format
    attributes:
      label: Blueprint format
      options:
        - Markdown
        - LaTeX
        - Both
        - Unsure
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Blueprint snippet
      description: Paste a small example that shows the syntax question.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to express or validate?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: "isabelle-blueprint check path/to/project"

