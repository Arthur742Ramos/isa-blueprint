name: test-pypi

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  testpypi:
    name: publish dry run to TestPyPI
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package + dev extras
        run: python -m pip install --upgrade pip build && pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy isabelle_blueprint

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build distribution
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
