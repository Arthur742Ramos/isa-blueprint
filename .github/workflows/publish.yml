name: publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'pyproject.toml'
      - 'isabelle_blueprint/__init__.py'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-plan:
    name: plan release
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.plan.outputs.should-release }}
      version: ${{ steps.plan.outputs.version }}
      tag-name: ${{ steps.plan.outputs.tag-name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          current_version="$(python - <<'PY'
          import pathlib
          import tomllib

          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          tag_name="v${current_version}"
          {
            echo "version=${current_version}"
            echo "tag-name=${tag_name}"
          } >> "$GITHUB_OUTPUT"

          check_init_version() {
            python - "$current_version" <<'PY'
          import ast
          import pathlib
          import sys

          expected = sys.argv[1]
          module = ast.parse(pathlib.Path("isabelle_blueprint/__init__.py").read_text(encoding="utf-8"))
          actual = None

          for node in module.body:
              if not isinstance(node, ast.Assign):
                  continue
              if not any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets):
                  continue
              if not isinstance(node.value, ast.Constant) or not isinstance(node.value.value, str):
                  raise SystemExit("__version__ must be assigned a string literal")
              actual = node.value.value
              break

          if actual is None:
              raise SystemExit("__version__ assignment was not found")

          if actual != expected:
              raise SystemExit(f"isabelle_blueprint.__version__ {actual} does not match pyproject.toml version {expected}")
          PY
          }

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag_name" ]; then
              echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $current_version"
              exit 1
            fi
            check_init_version
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit was available; skipping automatic release."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BEFORE_SHA:pyproject.toml" 2>/dev/null; then
            echo "No previous pyproject.toml was available; skipping automatic release."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git show "$BEFORE_SHA:pyproject.toml" > previous-pyproject.toml
          previous_version="$(python - <<'PY'
          import pathlib
          import tomllib

          print(tomllib.loads(pathlib.Path("previous-pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"

          if [ "$previous_version" = "$current_version" ]; then
            echo "pyproject.toml version stayed at $current_version; skipping release."
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          check_init_version
          echo "Detected version bump: $previous_version -> $current_version"
          echo "should-release=true" >> "$GITHUB_OUTPUT"

  pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: release-plan
    if: needs.release-plan.outputs.should-release == 'true'
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package + dev extras
        run: python -m pip install --upgrade pip build && pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy isabelle_blueprint

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build distribution
        run: |
          python -m build

      - name: Verify release tag
        if: github.ref_type == 'branch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-plan.outputs.tag-name }}
        run: |
          set -euo pipefail

          remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}^{}" | awk '{print $1}')"
          if [ -z "$remote_sha" ]; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}" | awk '{print $1}')"
          fi

          if [ -n "$remote_sha" ]; then
            if [ "$remote_sha" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG_NAME already exists at $remote_sha, not $GITHUB_SHA"
              exit 1
            fi
            echo "Tag $TAG_NAME already points to this commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG_NAME"
          fi

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-plan, pypi]
    if: needs.release-plan.outputs.should-release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Extract changelog notes
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          TAG_NAME: ${{ needs.release-plan.outputs.tag-name }}
        run: |
          awk -v version="$RELEASE_VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf "Release %s\n" "$TAG_NAME" > release-notes.md
          fi

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-plan.outputs.tag-name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file release-notes.md
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --title "$TAG_NAME" --notes-file release-notes.md
          fi
