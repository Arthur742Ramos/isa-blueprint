name: blueprint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ -q

  smoke:
    name: end-to-end smoke on the minimal example
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Graphviz (for SVG output)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Validate minimal example (check / graph / web / tasks / report)
        run: |
          isabelle-blueprint check  examples/minimal
          isabelle-blueprint compat examples/minimal
          isabelle-blueprint graph  examples/minimal
          isabelle-blueprint web    examples/minimal
          isabelle-blueprint tasks  examples/minimal
          isabelle-blueprint report examples/minimal

      - name: Upload generated site
        uses: actions/upload-artifact@v7
        with:
          name: minimal-example-site
          path: examples/minimal/site

  vscode:
    name: compile VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install extension dependencies
        run: npm ci
        working-directory: vscode

      - name: Compile extension
        run: npm run compile
        working-directory: vscode

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package + dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package + dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run mypy
        run: python -m mypy isabelle_blueprint

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package + dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run pytest with coverage gate
        run: >-
          python -m pytest tests/
          --cov=isabelle_blueprint
          --cov-report=term-missing
          --cov-fail-under=85
