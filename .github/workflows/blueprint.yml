name: blueprint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ -q

  mcp-minimum:
    name: MCP minimum SDK (1.12.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package and minimum MCP SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "mcp==1.12.4"
          pip install "pytest>=7.0"

      - name: Run MCP contract tests
        run: python -m pytest tests/test_mcp_server.py tests/test_capability_parity.py -q

  smoke:
    name: end-to-end smoke on the minimal example
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Graphviz (for SVG output)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Validate minimal example (check / graph / web / tasks / report)
        run: |
          isabelle-blueprint check  examples/minimal
          isabelle-blueprint compat examples/minimal
          isabelle-blueprint graph  examples/minimal
          isabelle-blueprint web    examples/minimal
          isabelle-blueprint tasks  examples/minimal
          isabelle-blueprint report examples/minimal

      - name: Upload generated site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: minimal-example-site
          path: examples/minimal/site

  e2e:
    name: end-to-end CLI against the built wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Graphviz (so SVG graph rendering is exercised E2E)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the built wheel with dev extras
        run: python -m pip install "$(ls dist/*.whl)[dev]"

      - name: Run the black-box E2E + packaging suite
        # Run from outside the checkout so in-process `import isabelle_blueprint`
        # (the packaging test) resolves to the installed wheel rather than the
        # source tree, which would otherwise shadow it on sys.path.
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest -q \
            "$GITHUB_WORKSPACE/tests/test_e2e.py" \
            "$GITHUB_WORKSPACE/tests/test_packaging.py"

  vscode:
    name: compile VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install extension dependencies
        run: npm ci
        working-directory: vscode

      - name: Compile extension
        run: npm run compile
        working-directory: vscode

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package + dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package + dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run mypy
        run: python -m mypy isabelle_blueprint

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package + dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run pytest with coverage gate
        run: >-
          python -m pytest tests/
          --cov=isabelle_blueprint
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=87

      - name: Upload coverage XML
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-xml
          path: coverage.xml
