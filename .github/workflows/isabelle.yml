name: Isabelle kernel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kernel:
    name: Isabelle2025-2 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ISABELLE_BLUEPRINT_KERNEL_TESTS: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.12'
      - name: Install checksum-pinned Isabelle2025-2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Isabelle2025-2_linux.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 \
            --max-time 600 --proto '=https' --proto-redir '=https' \
            'https://dist.isabelle.cit.tum.de/dist/Isabelle2025-2_linux.tar.gz?token=Isabelle' \
            --output "$archive"
          echo "a20a507bc7c1270d8be96a9f3fbec06345387789d2dc2c4d3df6260d47bfb33c  $archive" \
            | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/Isabelle2025-2/bin" >> "$GITHUB_PATH"
      - name: Install package and fixture test dependencies
        run: python -m pip install -e ".[mcp]" pytest
      - name: Verify kernel proof classifications and fresh cache evidence
        run: python -m pytest tests/test_isabelle_kernel.py -v -ra
      - name: Set up Node for real editor kernel lifecycle
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Compile extension and run behavior tests
        run: npm ci && npm test
        working-directory: vscode
      - name: Verify CLI, MCP and real editor against the pinned kernel
        run: xvfb-run -a npm run test:host
        working-directory: vscode
        env:
          ISABELLE_BLUEPRINT_EDITOR_KERNEL_TESTS: '1'
